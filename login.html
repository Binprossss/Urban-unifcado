<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanBuild | Portal de Administración</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Inicialización inmediata del tema antes del render (evita parpadeos FOUC)
        (function() {
            try {
                const savedTheme = localStorage.getItem('urbanbuild_theme') || localStorage.getItem('theme');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Open Sans"', 'sans-serif'] },
                    colors: {
                        hikred: { DEFAULT: '#c9122f', hover: '#a00e25' }
                    }
                }
            }
        };
    </script>
    <style>
        body { font-family: 'Open Sans', sans-serif; }
        html.dark { color-scheme: dark; }
        html.dark body { background-color: #09090b !important; color: #f4f4f5 !important; }
    </style>
</head>
<body class="h-full bg-gray-50 dark:bg-[#09090b] flex items-center justify-center antialiased transition-colors duration-200">

    <div class="w-full max-w-md px-4">
        <div class="bg-white dark:bg-[#121214] rounded-lg shadow-xl border-t-4 border-hikred p-8 relative border border-gray-200 dark:border-[#27272a]">

            <!-- Interruptor de Tema en Login -->
            <button id="theme-toggle" onclick="toggleTheme()" type="button" 
                    class="absolute top-4 right-4 p-2 rounded-lg text-gray-500 dark:text-zinc-300 hover:text-hikred dark:hover:text-hikred hover:bg-gray-100 dark:hover:bg-[#18181b] transition cursor-pointer border border-transparent dark:border-[#27272a]" 
                    title="Alternar tema claro/oscuro" aria-label="Alternar tema">
                <i id="theme-icon" class="fas fa-moon text-base"></i>
            </button>

            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold tracking-tighter text-black dark:text-white mb-1">Urban<span class="text-hikred">Build</span></h1>
                <p class="text-[11px] font-bold text-gray-500 dark:text-zinc-400 uppercase tracking-widest">Portal de Administración</p>
            </div>

            <form id="login-form" class="space-y-5" novalidate>
                <div class="bg-slate-50 dark:bg-[#18181b] border border-slate-200 dark:border-[#27272a] p-3 rounded-lg text-xs text-slate-800 dark:text-zinc-200 flex items-start gap-2.5">
                    <i class="fas fa-shield-halved text-hikred text-sm mt-0.5"></i>
                    <div>
                        <span class="font-bold text-gray-900 dark:text-white">Acceso seguro de administración:</span>
                        <p class="text-[11px] text-gray-600 dark:text-zinc-400 mt-0.5 leading-relaxed">La verificación se hace en el servidor y la sesión se guarda en una cookie protegida (HttpOnly). Las credenciales no están en el código de esta página.</p>
                    </div>
                </div>

                <div>
                    <label for="username" class="block text-xs font-semibold text-gray-600 dark:text-zinc-300 mb-1.5 uppercase tracking-wide">Usuario</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3 text-gray-400"><i class="fas fa-user text-sm"></i></span>
                        <input type="text" id="username" maxlength="200" class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-[#18181b] border border-gray-300 dark:border-[#27272a] rounded text-sm text-gray-800 dark:text-white focus:outline-none focus:border-hikred transition" placeholder="Ingresa tu usuario" required autocomplete="username">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-gray-600 dark:text-zinc-300 mb-1.5 uppercase tracking-wide">Contraseña</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3 text-gray-400"><i class="fas fa-lock text-sm"></i></span>
                        <input type="password" id="password" maxlength="500" class="w-full pl-10 pr-10 py-2.5 bg-white dark:bg-[#18181b] border border-gray-300 dark:border-[#27272a] rounded text-sm text-gray-800 dark:text-white focus:outline-none focus:border-hikred transition font-mono" placeholder="••••••••••••" required autocomplete="current-password">
                        <button type="button" id="toggle-pass" class="absolute right-3 text-gray-400 hover:text-gray-600 dark:hover:text-zinc-200 focus:outline-none cursor-pointer" title="Mostrar/Ocultar contraseña" aria-label="Mostrar u ocultar contraseña">
                            <i id="eye-icon" class="fas fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <div id="error-msg" role="alert" class="hidden text-xs text-red-600 dark:text-red-400 font-semibold text-center bg-red-50 dark:bg-red-950/30 p-2.5 rounded border border-red-200 dark:border-red-900/60"></div>

                <button id="btn-login" type="submit" class="w-full bg-hikred hover:bg-hikred-hover text-white font-bold py-3 rounded text-xs uppercase tracking-wider transition shadow-sm cursor-pointer flex items-center justify-center gap-2">
                    <i class="fas fa-lock"></i>
                    <span>Iniciar Sesión y Habilitar Edición</span>
                </button>
            </form>

            <div class="text-center mt-6">
                <a href="index.html" class="text-xs text-gray-500 dark:text-zinc-400 hover:text-hikred dark:hover:text-hikred transition font-semibold inline-flex items-center">
                    <i class="fas fa-arrow-left mr-1.5 text-[10px]"></i> Volver al sitio público
                </a>
            </div>
        </div>
    </div>

    <script>
        const BTN_HTML = '<i class="fas fa-lock"></i> <span>Iniciar Sesión y Habilitar Edición</span>';
        const $ = (id) => document.getElementById(id);

        // Control del Interruptor de Tema
        function updateThemeUI(isDark) {
            const icon = $('theme-icon');
            if (icon) {
                icon.className = isDark ? 'fas fa-sun text-base text-yellow-400' : 'fas fa-moon text-base';
            }
        }
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            try {
                localStorage.setItem('urbanbuild_theme', isDark ? 'dark' : 'light');
            } catch (e) {}
            updateThemeUI(isDark);
        }
        // Sincronizar icono inicial
        updateThemeUI(document.documentElement.classList.contains('dark'));

        // Solo se permite volver a páginas del propio sitio (evita redirecciones abiertas)
        function destinoSeguro() {
            const r = new URLSearchParams(location.search).get('redirect') || '';
            return /^[A-Za-z0-9_-]+\.html$/.test(r) ? r : 'index.html';
        }

        function mostrarError(texto) {
            const e = $('error-msg');
            e.textContent = texto;
            e.classList.remove('hidden');
        }

        $('toggle-pass').addEventListener('click', () => {
            const p = $('password'), i = $('eye-icon');
            const oculto = p.type === 'password';
            p.type = oculto ? 'text' : 'password';
            i.className = 'fas text-sm ' + (oculto ? 'fa-eye-slash' : 'fa-eye');
        });

        // Si ya hay una sesión válida en el servidor, no pedir credenciales otra vez
        fetch('/api/sesion', { credentials: 'same-origin', cache: 'no-store' })
            .then(r => r.ok ? r.json() : { autenticado: false })
            .then(s => { 
                if (s.autenticado) {
                    try { localStorage.setItem('urbanbuild_role', 'admin'); } catch (e) {}
                    location.replace(destinoSeguro()); 
                } 
            })
            .catch(() => {});

        $('login-form').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const usuario = $('username').value.trim();
            const clave = $('password').value;
            $('error-msg').classList.add('hidden');
            if (!usuario || !clave) return mostrarError('Escribe tu usuario y contraseña.');

            const btn = $('btn-login');
            btn.disabled = true;
            btn.classList.add('opacity-75');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Verificando credenciales...</span>';

            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, clave })
                });
                const datos = await resp.json().catch(() => ({}));
                if (resp.ok && datos.ok) {
                    try { 
                        sessionStorage.setItem('urban_just_logged_in', 'true'); 
                        localStorage.setItem('urbanbuild_role', 'admin');
                    } catch (e) {}
                    location.href = destinoSeguro();
                    return;
                }
                mostrarError(datos.detail || datos.error || 'No se pudo iniciar sesión.');
            } catch (e) {
                mostrarError('No se pudo conectar con el servidor. Inténtalo de nuevo.');
            }
            btn.disabled = false;
            btn.classList.remove('opacity-75');
            btn.innerHTML = BTN_HTML;
            $('password').value = '';
            $('password').focus();
        });
    </script>
</body>
</html>
